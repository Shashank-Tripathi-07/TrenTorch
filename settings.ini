[DEFAULT]
# All sections below are required unless otherwise specified.
# See https://github.com/fastai/nbdev/blob/master/settings.ini for examples.

### Python library ###
repo = TrenTorch
lib_name = trentorch
version = 0.1.13
min_python = 3.10
license = MIT
black_formatting = False

### nbdev ###
doc_path = _docs
lib_path = trentorch
nbs_path = modules
nbs_path_release = modules/release
recursive = True
tst_flags = notest
put_version_in_init = False

### Docs ###
branch = main
custom_sidebar = False
doc_host = https://trentorch.github.io
doc_baseurl = /TrenTorch/
git_url = https://github.com/Shashank-Tripathi-07/TrenTorch/
title = TrenTorch

### PyPI ###
audience = Developers
author = TrenTorch Team
author_email = team@trentorch.org
copyright = 2026 onwards, TrenTorch Team
description = Build ML Systems from Scratch - A hands-on systems course
keywords = machine learning, deep learning, systems, education
language = English
status = 3
user = trentorch

### Optional ###
requirements = numpy>=1.20.0 matplotlib>=3.3.0 rich>=10.0.0 jupyter>=1.0.0 pytest>=6.0.0
dev_requirements = nbdev>=2.3.0 black>=22.0.0

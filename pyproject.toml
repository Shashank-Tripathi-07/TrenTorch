[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "trentorch"
version = "0.1.13"
description = "TrenTorch - Machine Learning Systems Engineering Framework from Scratch"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Shashank Tripathi"},
    {name = "Shivtej Gaikwad"},
    {name = "Aadityansha Verma"},
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Engineering :: Intelligent Systems",
]
dependencies = [
    "numpy>=2.2.6,<3.0.0",
    "rich>=15.0.0",
    "PyYAML>=6.0.3",
    "pytest>=8.0.0",
]

[project.scripts]
tren = "platforms.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "jupytext>=1.19.3",
    "nbformat>=5.10.4",
    "jupyter>=1.1.1",
    "jupyterlab>=4.5.7",
    "ipykernel>=7.2.0",
    "nbdev>=3.0.15,<3.3.13",
]
visualization = [
    "matplotlib>=3.10.9",  # For plotting in Modules 17, 19, 20
]
docs = [
    "jupyter-book>=2.1.5,<3.0.0",
    "sphinxcontrib-mermaid>=2.0.2",
    "matplotlib>=3.10.9",
    "ipykernel>=6.0.0",
    "ipywidgets>=8.1.8",
]

[tool.nbdev]
lib_name = "trentorch"
lib_path = "trentorch"
nbs_path = "data/modules"
doc_path = "_docs"
branch = "main"
recursive = true
tst_flags = "notest"
put_version_in_init = false
custom_sidebar = false
doc_host = "https://trentorch.github.io"
doc_baseurl = "/TrenTorch/"

[project.urls]
Homepage = "https://trentorch.vercel.app"
Repository = "https://github.com/Shashank-Tripathi-07/TrenTorch"
Documentation = "https://github.com/ShivtejG236/docs4TrenTorch"
Issues = "https://github.com/Shashank-Tripathi-07/TrenTorch/issues"

# trentorch's own source now lives at data/trentorch/ (grouped with the
# rest of the curriculum's generated content), but the installed package
# and every "import trentorch" / "from trentorch.core.tensor import
# Tensor" call site must keep resolving exactly as before. Listing
# "data" as a second discovery root (alongside ".") is what makes that
# true: setuptools finds "trentorch*" packages rooted there and reports
# them under their real top-level name ("trentorch", "trentorch.core",
# ...), not "data.trentorch" -- the physical move is invisible to every
# import statement.
[tool.setuptools.packages.find]
where = [".", "data"]
include = ["tinytorch*", "platforms*", "trentorch*"]
exclude = ["tests*", "data*", "site*", "docs*", "assignments*"]

# TinyTorch-specific pytest configuration (overrides parent pyproject.toml)
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["data/src", "data/milestones", "platforms", "tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "quick: marks tests as quick",
]
# No coverage in TrenTorch tests - we don't need coverage for educational code
addopts = ["--strict-markers"]

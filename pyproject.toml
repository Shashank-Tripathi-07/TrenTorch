[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "trentorch"
version = "1.0.0"
description = "TrenTorch - Machine Learning Systems Engineering Framework from Scratch"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Shashank Tripathi"},
    {name = "Shivtej Gaikwad"},
    {name = "Aadityansha Verma"},
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Engineering :: Intelligent Systems",
]
dependencies = [
    "numpy>=2.2.6,<3.0.0",
    "rich>=15.0.0",
    "PyYAML>=6.0.3",
    "pytest>=8.0.0",
]

[project.scripts]
tren = "platforms.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "jupytext>=1.19.3",
    "nbformat>=5.10.4",
    "jupyter>=1.1.1",
    "jupyterlab>=4.5.7",
    "ipykernel>=7.2.0",
    "nbdev>=3.0.15,<3.3.15",
]
visualization = [
    "matplotlib>=3.10.9",  # For plotting in Modules 17, 19, 20
]
tui = [
    "textual>=8.0.0",  # Interactive `tren tui` / `tren -i` dashboard
]
docs = [
    "jupyter-book>=2.1.5,<3.0.0",
    "sphinxcontrib-mermaid>=2.0.2",
    "matplotlib>=3.10.9",
    "ipykernel>=6.0.0",
    "ipywidgets>=8.1.8",
]

[tool.nbdev]
lib_name = "trentorch"
lib_path = "trentorch"
nbs_path = "data/modules"
doc_path = "_docs"
branch = "main"
recursive = true
tst_flags = "notest"
put_version_in_init = false
custom_sidebar = false
doc_host = "https://trentorch.github.io"
doc_baseurl = "/TrenTorch/"

[project.urls]
Homepage = "https://trentorch.vercel.app"
Repository = "https://github.com/TrenTorch/TrenTorch"
Documentation = "https://github.com/ShivtejG236/docs4TrenTorch"
Issues = "https://github.com/TrenTorch/TrenTorch/issues"

# trentorch's own source now lives at data/trentorch/ (grouped with the
# rest of the curriculum's generated content), but the installed package
# and every "import trentorch" / "from trentorch.core.tensor import
# Tensor" call site must keep resolving exactly as before. Listing
# "data" as a second discovery root (alongside ".") is what makes that
# true: setuptools finds "trentorch*" packages rooted there and reports
# them under their real top-level name ("trentorch", "trentorch.core",
# ...), not "data.trentorch" -- the physical move is invisible to every
# import statement.
[tool.setuptools.packages.find]
where = [".", "data"]
include = ["platforms*", "trentorch*"]
exclude = ["tests*", "data*", "site*", "docs*", "assignments*"]

# Formatting/linting. Kept deliberately permissive for an educational
# codebase: no docstring-content rules, no complexity/argument-count
# limits (this repo's naive nested-loop Conv2d and similar are
# intentional curriculum content, not bugs to flag), no type-annotation
# requirements. Style and real correctness footguns only.
[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = [
    "data/trentorch",   # generated package, autogenerated banner already says don't edit
    "data/modules",     # generated stub notebooks
    "data/solutions",   # generated reference notebooks
    # The main data/src/<NN>/<NN>.py curriculum files (not their tests/
    # subdirectories, which are ordinary Python and stay linted) are
    # jupytext percent-format files: `# %%` lines are cell boundaries
    # nbdev's export pipeline depends on, not decorative comments. Ruff
    # has no notion of that convention and will happily reorder a `# %%`
    # marker relative to the import/code around it while sorting imports
    # or reformatting -- confirmed the hard way: `ruff format` alone
    # (no manual edits) moved a `# %%` marker to *after* an import
    # statement it used to close, silently merging that import into the
    # next cell and dropping it from the exported package (a NameError
    # only surfaced in CI, since the local venv was still running an
    # already-built package from before the reformat). See
    # platforms/cli/commands/export_utils.py's module docstring for the
    # cell-pairing mechanics these files must stay untouched for ruff to
    # not corrupt.
    "data/src/01_tensor/01_tensor.py",
    "data/src/02_activations/02_activations.py",
    "data/src/03_layers/03_layers.py",
    "data/src/04_losses/04_losses.py",
    "data/src/05_dataloader/05_dataloader.py",
    "data/src/06_autograd/06_autograd.py",
    "data/src/07_optimizers/07_optimizers.py",
    "data/src/08_training/08_training.py",
    "data/src/09_convolutions/09_convolutions.py",
    "data/src/10_tokenization/10_tokenization.py",
    "data/src/11_embeddings/11_embeddings.py",
    "data/src/12_attention/12_attention.py",
    "data/src/13_transformers/13_transformers.py",
    "data/src/14_profiling/14_profiling.py",
    "data/src/15_quantization/15_quantization.py",
    "data/src/16_compression/16_compression.py",
    "data/src/17_acceleration/17_acceleration.py",
    "data/src/18_memoization/18_memoization.py",
    "data/src/19_benchmarking/19_benchmarking.py",
    "data/src/20_capstone/20_capstone.py",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (unused imports/vars, undefined names, etc.)
    "I",   # isort (import sorting)
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade (modern Python syntax)
]
ignore = [
    "E501",  # line-too-long: format handles wrapping; a few long docstring/URL
             # lines aren't worth fighting
    "E402",  # module-import-not-at-top-of-file: this codebase's established
             # pattern is `import numpy as np` followed immediately by
             # `rng = np.random.default_rng(7)`, then more imports -- not
             # sloppiness, and reordering ~400 occurrences isn't worth it
             # for a stylistic nit.
    "UP035", # deprecated-import (typing.Dict/List/Tuple -> dict/list/tuple):
             # ruff offers no safe or unsafe autofix for the remaining
             # instances (usage sites it can't rewrite confidently), and
             # hand-rewriting each one is pure modernization, not a real
             # correctness or readability issue.
]

[tool.ruff.lint.per-file-ignores]
# Curriculum modules intentionally re-export names for the exported package's
# public API, and their heavy top-of-file docstrings are the actual lesson.
# (The main data/src/*/<NN>_name.py files themselves are fully excluded
# above, not just rule-ignored here -- this covers the data/src/*/tests/
# files, which are ordinary Python and don't have that problem.)
"data/src/**/*.py" = ["F401", "F403"]

# TrenTorch-specific pytest configuration (overrides parent pyproject.toml)
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["data/src", "data/milestones", "platforms", "tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "quick: marks tests as quick",
]
# No coverage in TrenTorch tests - we don't need coverage for educational code
addopts = ["--strict-markers"]

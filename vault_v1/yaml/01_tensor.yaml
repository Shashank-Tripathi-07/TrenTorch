description: "# Module 01: Tensor Foundation - Building Blocks of ML\n\nWelcome to\
  \ Module 01! You're about to build the foundational Tensor class that powers all\
  \ machine learning operations.\n\n## \U0001F517 Prerequisites & Progress\n**You've\
  \ Built**: Nothing - this is our foundation!\n**You'll Build**: A complete Tensor\
  \ class with arithmetic, matrix operations, and shape manipulation\n**You'll Enable**:\
  \ Foundation for activations, layers, and all future neural network components\n\
  \n**Connection Map**:\n```\nNumPy Arrays \u2192 Tensor \u2192 Activations (Module\
  \ 02)\n(raw data)   (ML ops)  (intelligence)\n```\n\n## \U0001F3AF Learning Objectives\n\
  By the end of this module, you will:\n1. Implement a complete Tensor class with\
  \ fundamental operations\n2. Understand tensors as the universal data structure\
  \ in ML\n3. Master broadcasting, matrix multiplication, and shape manipulation\n\
  4. Test tensor operations with immediate validation\n\nLet's get started!\n\n##\
  \ \U0001F4E6 Where This Code Lives in the Final Package\n\n**Learning Side:** You\
  \ work in src/01_tensor/01_tensor.py\n**Building Side:** Code exports to trentorch.core.tensor\n\
  \n```python\n# Final package structure:\n# Other modules will import and use this\
  \ Tensor\n```\n\n**Why this matters:**\n- **Learning:** Complete tensor system in\
  \ one focused module for deep understanding\n- **Production:** Proper organization\
  \ like PyTorch's torch.Tensor with all core operations together\n- **Consistency:**\
  \ All tensor operations and data manipulation in core.tensor\n- **Integration:**\
  \ Foundation that every other module will build upon\n\n## \U0001F4CB Module Dependencies\n\
  \n**Prerequisites**: NONE - This is the foundation module\n\n**External Dependencies**:\n\
  - `numpy` (for array operations and numerical computing)\n\n**TrenTorch Dependencies**:\
  \ NONE\n\n**Important**: This module has NO TrenTorch dependencies.\nOther modules\
  \ will import FROM this module.\n\n**Dependency Flow**:\n```\nModule 01 (Tensor)\
  \ \u2192 All Other Modules\n     \u2193\n  Foundation for entire TrenTorch system\n\
  ```\n\nStudents completing this module will have built the foundation\nthat every\
  \ other TrenTorch component depends on."
starter_code: "import os\nimport numpy as np\nrng = np.random.default_rng(7)\n\n#\
  \ Constants for memory calculations\nBYTES_PER_FLOAT32 = 4  # Standard float32 size\
  \ in bytes\nKB_TO_BYTES = 1024  # Kilobytes to bytes conversion\nMB_TO_BYTES = 1024\
  \ * 1024  # Megabytes to bytes conversion\n\nclass Tensor:\n    \"\"\"Educational\
  \ tensor - the foundation of machine learning computation.\n\n    This class provides\
  \ the core data structure for all ML operations:\n    - data: The actual numerical\
  \ values (NumPy array)\n    - shape: Dimensions of the tensor\n    - ndim: Number\
  \ of dimensions (0=scalar, 1=vector, 2=matrix, ...)\n    - size: Total number of\
  \ elements\n    - dtype: Data type (float32)\n\n    All arithmetic, matrix, and\
  \ shape operations are built on this foundation.\n    \"\"\"\n\n    def __init__(self,\
  \ data):\n        \"\"\"Create a new tensor from data.\n\n        TODO: Initialize\
  \ a Tensor by wrapping data in a NumPy array and setting attributes.\n\n       \
  \ APPROACH:\n        1. Convert data to NumPy array with dtype=float32\n       \
  \ 2. Store the array as self.data\n        3. Set self.shape from the array's shape\n\
  \        4. Set self.size from the array's size\n        5. Set self.dtype from\
  \ the array's dtype\n        EXAMPLE:\n        >>> t = Tensor([1, 2, 3])\n     \
  \   >>> print(t.shape)\n        (3,)\n        >>> print(t.size)\n        3\n\n \
  \       HINT: Use np.array(data, dtype=np.float32) to convert data to NumPy array\n\
  \        \"\"\"\n        if isinstance(data, (list, tuple)) and len(data) > 0 and\
  \ isinstance(data[0], Tensor):\n            data = np.stack([t.data for t in data])\n\
  \        self.data = np.array(data, dtype=np.float32)\n        self.shape = self.data.shape\n\
  \        self.size = self.data.size\n        self.dtype = self.data.dtype\n\n  \
  \  def __repr__(self):\n        \"\"\"String representation of tensor for debugging.\"\
  \"\"\n        return f\"Tensor(data={self.data}, shape={self.shape})\"\n\n    def\
  \ __str__(self):\n        \"\"\"Human-readable string representation.\"\"\"\n  \
  \      return f\"Tensor({self.data})\"\n\n    def numpy(self):\n        \"\"\"Return\
  \ the underlying NumPy array.\"\"\"\n        return self.data\n\n    def memory_footprint(self):\n\
  \        \"\"\"Calculate exact memory usage in bytes.\n\n        Systems Concept:\
  \ Understanding memory footprint is fundamental to ML systems.\n        Before running\
  \ any operation, engineers should know how much memory it requires.\n\n        Returns:\n\
  \            int: Memory usage in bytes (e.g., 1000x1000 float32 = 4MB)\n      \
  \  \"\"\"\n        return self.data.nbytes\n\n    @property\n    def ndim(self):\n\
  \        \"\"\"Number of tensor dimensions (0=scalar, 1=vector, 2=matrix, ...).\"\
  \"\"\n        return len(self.shape)\n\n    def numel(self):\n        \"\"\"Return\
  \ total number of elements (PyTorch-compatible).\"\"\"\n        return self.size\n\
  \n    def contiguous(self):\n        \"\"\"Return a contiguous copy of the tensor\
  \ data (PyTorch-compatible).\"\"\"\n        return Tensor(np.ascontiguousarray(self.data))\n\
  \n    def view(self, *shape):\n        \"\"\"Alias for reshape, matching PyTorch's\
  \ Tensor.view() for contiguous tensors.\"\"\"\n        return self.reshape(*shape)\n\
  \n    def masked_fill(self, mask, value):\n        \"\"\"Fill positions where mask\
  \ is True with value, matching PyTorch's masked_fill.\n\n        Used in transformer\
  \ attention to set padding positions to -inf before softmax.\n\n        Args:\n\
  \            mask:  A Tensor or numpy array of booleans, same shape as self (or\
  \ broadcastable).\n            value: Scalar fill value (e.g. float('-inf') for\
  \ attention masking).\n\n        Returns:\n            New Tensor with masked positions\
  \ replaced by value.\n        \"\"\"\n        mask_array = mask.data.astype(bool)\
  \ if isinstance(mask, Tensor) else np.asarray(mask, dtype=bool)\n        result\
  \ = self.data.copy()\n        result[mask_array] = value\n        return Tensor(result)\n\
  \n    def __add__(self, other):\n        \"\"\"Add two tensors element-wise with\
  \ broadcasting support.\n\n        TODO: Implement element-wise addition that works\
  \ with both Tensors and scalars.\n\n        APPROACH:\n        1. Check if other\
  \ is a Tensor (use isinstance)\n        2. If Tensor: add self.data + other.data\n\
  \        3. If scalar: add self.data + other (broadcasting)\n        4. Wrap result\
  \ in new Tensor\n\n        EXAMPLE:\n        >>> a = Tensor([1, 2, 3])\n       \
  \ >>> b = Tensor([4, 5, 6])\n        >>> c = a + b\n        >>> print(c.data)\n\
  \        [5. 7. 9.]\n\n        HINT: NumPy's + operator handles broadcasting automatically\n\
  \        \"\"\"\n        if isinstance(other, Tensor):\n            return Tensor(self.data\
  \ + other.data)\n        else:\n            return Tensor(self.data + other)\n\n\
  \    def __radd__(self, other):\n        \"\"\"Support natural scalar arithmetic:\
  \ scalar + tensor.\"\"\"\n        return self.__add__(other)\n\n    def __sub__(self,\
  \ other):\n        \"\"\"Subtract two tensors element-wise.\n\n        TODO: Implement\
  \ element-wise subtraction (same pattern as __add__).\n\n        APPROACH:\n   \
  \     1. Check if other is a Tensor\n        2. If Tensor: subtract self.data -\
  \ other.data\n        3. If scalar: subtract self.data - other\n        4. Return\
  \ new Tensor with result\n\n        EXAMPLE:\n        >>> a = Tensor([5, 7, 9])\n\
  \        >>> b = Tensor([1, 2, 3])\n        >>> c = a - b\n        >>> print(c.data)\n\
  \        [4. 5. 6.]\n\n        HINT: Follow the same pattern as __add__ but with\
  \ subtraction\n        \"\"\"\n        if isinstance(other, Tensor):\n         \
  \   return Tensor(self.data - other.data)\n        else:\n            return Tensor(self.data\
  \ - other)\n\n    def __rsub__(self, other):\n        \"\"\"Support natural scalar\
  \ arithmetic: scalar - tensor.\"\"\"\n        if isinstance(other, Tensor):\n  \
  \          return Tensor(other.data - self.data)\n        return Tensor(other -\
  \ self.data)\n\n    def __mul__(self, other):\n        \"\"\"Multiply two tensors\
  \ element-wise (NOT matrix multiplication).\n\n        TODO: Implement element-wise\
  \ multiplication (same pattern as __add__).\n\n        APPROACH:\n        1. Check\
  \ if other is a Tensor\n        2. If Tensor: multiply self.data * other.data\n\
  \        3. If scalar: multiply self.data * other\n        4. Return new Tensor\
  \ with result\n\n        EXAMPLE:\n        >>> a = Tensor([1, 2, 3])\n        >>>\
  \ b = Tensor([4, 5, 6])\n        >>> c = a * b\n        >>> print(c.data)\n    \
  \    [ 4. 10. 18.]\n\n        HINT: Element-wise multiplication is *, not matrix\
  \ multiplication (@)\n        \"\"\"\n        if isinstance(other, Tensor):\n  \
  \          return Tensor(self.data * other.data)\n        else:\n            return\
  \ Tensor(self.data * other)\n\n    def __rmul__(self, other):\n        \"\"\"Support\
  \ natural scalar arithmetic: scalar * tensor.\"\"\"\n        return self.__mul__(other)\n\
  \n    def __truediv__(self, other):\n        \"\"\"Divide two tensors element-wise.\n\
  \n        TODO: Implement element-wise division (same pattern as __add__).\n\n \
  \       APPROACH:\n        1. Check if other is a Tensor\n        2. If Tensor:\
  \ divide self.data / other.data\n        3. If scalar: divide self.data / other\n\
  \        4. Return new Tensor with result\n\n        EXAMPLE:\n        >>> a = Tensor([4,\
  \ 6, 8])\n        >>> b = Tensor([2, 2, 2])\n        >>> c = a / b\n        >>>\
  \ print(c.data)\n        [2. 3. 4.]\n\n        HINT: Division creates float results\
  \ automatically due to float32 dtype\n        \"\"\"\n        if isinstance(other,\
  \ Tensor):\n            return Tensor(self.data / other.data)\n        else:\n \
  \           return Tensor(self.data / other)\n\n    def __rtruediv__(self, other):\n\
  \        \"\"\"Support natural scalar arithmetic: scalar / tensor.\"\"\"\n     \
  \   if isinstance(other, Tensor):\n            return Tensor(other.data / self.data)\n\
  \        return Tensor(other / self.data)\n\n    def _validate_matmul_shapes(self,\
  \ other):\n        \"\"\"Validate that two tensors are compatible for matrix multiplication.\n\
  \n        This helper checks three conditions before any computation begins:\n \
  \       1. The other operand must be a Tensor (not a plain number or array)\n  \
  \      2. Neither operand can be a 0D scalar (scalars use * instead)\n        3.\
  \ For 2D+ tensors, the inner dimensions must align\n\n        TODO: Implement the\
  \ three validation checks for matrix multiplication.\n\n        APPROACH:\n    \
  \    1. Check isinstance(other, Tensor) - raise TypeError if not\n        2. Check\
  \ both tensors are at least 1D - raise ValueError if 0D\n        3. For 2D+ tensors,\
  \ check self.shape[-1] == other.shape[-2]\n\n        EXAMPLE:\n        >>> a = Tensor([[1,\
  \ 2], [3, 4]])  # 2x2\n        >>> b = Tensor([[5, 6], [7, 8]])  # 2x2\n       \
  \ >>> a._validate_matmul_shapes(b)  # No error - shapes are compatible\n       \
  \ >>> c = Tensor([[1, 2, 3]])        # 1x3\n        >>> d = Tensor([[1], [2]]) \
  \        # 2x1\n        >>> c._validate_matmul_shapes(d)   # ValueError - 3 != 2\n\
  \n        HINT: Use len(tensor.shape) to check dimensionality and tensor.shape[-1]\n\
  \        to access the last dimension.\n        \"\"\"\n        if not isinstance(other,\
  \ Tensor):\n            raise TypeError(\n                f\"Matrix multiplication\
  \ requires Tensor, got {type(other).__name__}\\n\"\n                f\"  \u274C\
  \ Cannot perform: Tensor @ {type(other).__name__}\\n\"\n                f\"  \U0001F4A1\
  \ Matrix multiplication (@) only works between two Tensors\\n\"\n              \
  \  f\"  \U0001F527 Wrap your data: Tensor({other}) @ other_tensor\"\n          \
  \  )\n        if len(self.shape) == 0 or len(other.shape) == 0:\n            raise\
  \ ValueError(\n                f\"Matrix multiplication requires at least 1D tensors\\\
  n\"\n                f\"  \u274C Got shapes: {self.shape} @ {other.shape}\\n\"\n\
  \                f\"  \U0001F4A1 Scalars (0D tensors) cannot be matrix-multiplied;\
  \ use * for element-wise\\n\"\n                f\"  \U0001F527 Reshape scalar to\
  \ 1D: tensor.reshape(1) or use tensor * scalar\"\n            )\n        if len(self.shape)\
  \ >= 2 and len(other.shape) >= 2:\n            if self.shape[-1] != other.shape[-2]:\n\
  \                raise ValueError(\n                    f\"Matrix multiplication\
  \ shape mismatch: {self.shape} @ {other.shape}\\n\"\n                    f\"  \u274C\
  \ Inner dimensions don't match: {self.shape[-1]} vs {other.shape[-2]}\\n\"\n   \
  \                 f\"  \U0001F4A1 For A @ B, A's last dim must equal B's second-to-last\
  \ dim\\n\"\n                    f\"  \U0001F527 Try: other.transpose() to get shape\
  \ {other.shape[::-1]}, or reshape self\"\n                )\n\n    def matmul(self,\
  \ other):\n        \"\"\"Matrix multiplication of two tensors.\n\n        Validates\
  \ shapes via _validate_matmul_shapes, then computes the product.\n        For 2D\
  \ matrices, uses explicit nested loops so you can see exactly how\n        each\
  \ output element is a dot product of a row and a column. For batched\n        (3D+)\
  \ inputs, delegates to np.matmul.\n\n        TODO: Validate inputs with _validate_matmul_shapes,\
  \ then compute the\n        matrix product using explicit loops for 2D and np.matmul\
  \ for 3D+.\n\n        APPROACH:\n        1. Call self._validate_matmul_shapes(other)\
  \ to check compatibility\n        2. For 2D matrices: use explicit nested loops\
  \ with np.dot per element\n        3. For batched (3D+): use np.matmul for correctness\n\
  \        4. Return result wrapped in Tensor\n\n        EXAMPLE:\n        >>> a =\
  \ Tensor([[1, 2], [3, 4]])  # 2x2\n        >>> b = Tensor([[5, 6], [7, 8]])  # 2x2\n\
  \        >>> c = a.matmul(b)\n        >>> print(c.data)\n        [[19. 22.]\n  \
  \       [43. 50.]]\n\n        HINTS:\n        - Inner dimensions must match: (M,\
  \ K) @ (K, N) = (M, N)\n        - For 2D case: use np.dot(a[i, :], b[:, j]) for\
  \ each output element\n        - The validation helper already handles all error\
  \ cases\n        \"\"\"\n        self._validate_matmul_shapes(other)\n\n       \
  \ # Educational implementation: explicit loops to show what matrix multiplication\
  \ does\n        # This is intentionally slower than np.matmul to demonstrate the\
  \ value of vectorization\n\n        a = self.data\n        b = other.data\n\n  \
  \      # Handle 2D matrices with explicit loops (educational)\n        if len(a.shape)\
  \ == 2 and len(b.shape) == 2:\n            M, K = a.shape\n            K2, N = b.shape\n\
  \            result_data = np.zeros((M, N), dtype=a.dtype)\n\n            # Explicit\
  \ nested loops - students can see exactly what's happening!\n            # Each\
  \ output element is a dot product of a row from A and a column from B\n        \
  \    for i in range(M):\n                for j in range(N):\n                  \
  \  # Dot product of row i from A with column j from B\n                    result_data[i,\
  \ j] = np.dot(a[i, :], b[:, j])\n        else:\n            # For batched operations\
  \ (3D+), use np.matmul for correctness\n            # Students will understand this\
  \ once they grasp the 2D case\n            result_data = np.matmul(a, b)\n\n   \
  \     return Tensor(result_data)\n\n    def __matmul__(self, other):\n        \"\
  \"\"Enable @ operator for matrix multiplication.\"\"\"\n        return self.matmul(other)\n\
  \n    def __getitem__(self, key):\n        \"\"\"Enable indexing and slicing operations\
  \ on Tensors.\n\n        TODO: Implement indexing and slicing that returns a new\
  \ Tensor.\n\n        APPROACH:\n        1. Use NumPy indexing: self.data[key]\n\
  \        2. If result is not an ndarray, wrap in np.array\n        3. Return result\
  \ wrapped in new Tensor\n\n        EXAMPLE:\n        >>> t = Tensor([[1, 2, 3],\
  \ [4, 5, 6]])\n        >>> row = t[0]  # First row\n        >>> print(row.data)\n\
  \        [1. 2. 3.]\n        >>> element = t[0, 1]  # Single element\n        >>>\
  \ print(element.data)\n        2.0\n\n        HINT: NumPy's indexing already handles\
  \ all complex cases (slicing, fancy indexing)\n        \"\"\"\n        result_data\
  \ = self.data[key]\n        if not isinstance(result_data, np.ndarray):\n      \
  \      result_data = np.array(result_data)\n        return Tensor(result_data)\n\
  \n    def reshape(self, *shape):\n        \"\"\"Reshape tensor to new dimensions.\n\
  \n        TODO: Reshape tensor while preserving total element count.\n\n       \
  \ APPROACH:\n        1. Handle both reshape(2, 3) and reshape((2, 3)) calling styles\n\
  \        2. If -1 in shape, infer that dimension from total size\n        3. Validate\
  \ total elements match: np.prod(new_shape) == self.size\n        4. Use np.reshape\
  \ to create new view\n        5. Return result wrapped in new Tensor\n\n       \
  \ EXAMPLE:\n        >>> t = Tensor([1, 2, 3, 4, 5, 6])\n        >>> reshaped = t.reshape(2,\
  \ 3)\n        >>> print(reshaped.data)\n        [[1. 2. 3.]\n         [4. 5. 6.]]\n\
  \        >>> auto = t.reshape(2, -1)  # Infers -1 as 3\n        >>> print(auto.shape)\n\
  \        (2, 3)\n\n        HINTS:\n        - Use isinstance(shape[0], (tuple, list))\
  \ to detect tuple input\n        - For -1: unknown_dim = self.size // known_size\n\
  \        - Raise ValueError if total elements don't match\n        \"\"\"\n    \
  \    if len(shape) == 1 and isinstance(shape[0], (tuple, list)):\n            new_shape\
  \ = tuple(shape[0])\n        else:\n            new_shape = shape\n        if -1\
  \ in new_shape:\n            if new_shape.count(-1) > 1:\n                raise\
  \ ValueError(\n                    f\"Cannot reshape {self.shape} with multiple\
  \ unknown dimensions\\n\"\n                    f\"  \u274C Found {new_shape.count(-1)}\
  \ dimensions set to -1 in {new_shape}\\n\"\n                    f\"  \U0001F4A1\
  \ Only one dimension can be inferred; others must be specified\\n\"\n          \
  \          f\"  \U0001F527 Replace all but one -1 with explicit sizes (total elements:\
  \ {self.size})\"\n                )\n            known_size = 1\n            unknown_idx\
  \ = new_shape.index(-1)\n            for i, dim in enumerate(new_shape):\n     \
  \           if i != unknown_idx:\n                    known_size *= dim\n      \
  \      if self.size % known_size != 0:\n                raise ValueError(\n    \
  \                f\"Cannot infer -1 dimension: {self.size} elements is not \"\n\
  \                    f\"divisible by the known dimensions product {known_size}\\\
  n\"\n                    f\"  \u274C {self.size} % {known_size} = {self.size % known_size}\\\
  n\"\n                    f\"  \U0001F4A1 The -1 dimension must be a whole number\"\
  \n                )\n            unknown_dim = self.size // known_size\n       \
  \     new_shape = list(new_shape)\n            new_shape[unknown_idx] = unknown_dim\n\
  \            new_shape = tuple(new_shape)\n        if np.prod(new_shape) != self.size:\n\
  \            target_size = int(np.prod(new_shape))\n            raise ValueError(\n\
  \                f\"Cannot reshape {self.shape} to {new_shape}\\n\"\n          \
  \      f\"  \u274C Element count mismatch: {self.size} elements vs {target_size}\
  \ elements\\n\"\n                f\"  \U0001F4A1 Reshape preserves data, so total\
  \ elements must stay the same\\n\"\n                f\"  \U0001F527 Use -1 to infer\
  \ a dimension: reshape(-1, {new_shape[-1] if len(new_shape) > 0 else 1}) lets NumPy\
  \ calculate\"\n            )\n        reshaped_data = np.reshape(self.data, new_shape)\n\
  \        return Tensor(reshaped_data)\n\n    def transpose(self, dim0=None, dim1=None):\n\
  \        \"\"\"Transpose tensor dimensions.\n\n        TODO: Swap tensor dimensions\
  \ (default: swap last two dimensions).\n\n        APPROACH:\n        1. If no dims\
  \ specified: swap last two dimensions (most common case)\n        2. For 1D tensors:\
  \ return copy (no transpose needed)\n        3. If both dims specified: swap those\
  \ specific dimensions\n        4. Use np.transpose with axes list to perform the\
  \ swap\n        5. Return result wrapped in new Tensor\n\n        EXAMPLE:\n   \
  \     >>> t = Tensor([[1, 2, 3], [4, 5, 6]])  # 2\xD73\n        >>> transposed =\
  \ t.transpose()\n        >>> print(transposed.data)\n        [[1. 4.]\n        \
  \ [2. 5.]\n         [3. 6.]]  # 3\xD72\n\n        HINTS:\n        - Create axes\
  \ list: [0, 1, 2, ...] then swap positions\n        - For default: axes[-2], axes[-1]\
  \ = axes[-1], axes[-2]\n        - Use np.transpose(self.data, axes)\n        \"\"\
  \"\n        if dim0 is None and dim1 is None:\n            if len(self.shape) <\
  \ 2:\n                return Tensor(self.data.copy())\n            else:\n     \
  \           axes = list(range(len(self.shape)))\n                axes[-2], axes[-1]\
  \ = axes[-1], axes[-2]\n                transposed_data = np.transpose(self.data,\
  \ axes)\n        else:\n            if dim0 is None or dim1 is None:\n         \
  \       provided = f\"dim0={dim0}\" if dim1 is None else f\"dim1={dim1}\"\n    \
  \            missing = \"dim1\" if dim1 is None else \"dim0\"\n                raise\
  \ ValueError(\n                    f\"Transpose requires both dimensions to be specified\\\
  n\"\n                    f\"  \u274C Got {provided}, but {missing} is None\\n\"\n\
  \                    f\"  \U0001F4A1 Either provide both dims or neither (default\
  \ swaps last two)\\n\"\n                    f\"  \U0001F527 Use transpose({dim0\
  \ if dim0 is not None else 0}, {dim1 if dim1 is not None else 1}) or just transpose()\"\
  \n                )\n            axes = list(range(len(self.shape)))\n         \
  \   axes[dim0], axes[dim1] = axes[dim1], axes[dim0]\n            transposed_data\
  \ = np.transpose(self.data, axes)\n        return Tensor(transposed_data)\n\n  \
  \  def sum(self, axis=None, keepdims=False):\n        \"\"\"Sum tensor along specified\
  \ axis.\n\n        TODO: Sum all elements or along specific axes.\n\n        APPROACH:\n\
  \        1. Use np.sum with axis and keepdims parameters\n        2. axis=None sums\
  \ all elements (scalar result)\n        3. axis=N sums along dimension N\n     \
  \   4. keepdims=True preserves original number of dimensions\n        5. Return\
  \ result wrapped in Tensor\n\n        EXAMPLE:\n        >>> t = Tensor([[1, 2, 3],\
  \ [4, 5, 6]])\n        >>> total = t.sum()\n        >>> print(total.data)\n    \
  \    21.0\n        >>> col_sum = t.sum(axis=0)\n        >>> print(col_sum.data)\n\
  \        [5. 7. 9.]\n\n        HINT: np.sum(data, axis=axis, keepdims=keepdims)\
  \ does all the work\n        \"\"\"\n        result = np.sum(self.data, axis=axis,\
  \ keepdims=keepdims)\n        return Tensor(result)\n\n    def mean(self, axis=None,\
  \ keepdims=False):\n        \"\"\"Compute mean of tensor along specified axis.\n\
  \n        TODO: Calculate average of elements along axis (same pattern as sum).\n\
  \n        APPROACH:\n        1. Use np.mean with axis and keepdims parameters\n\
  \        2. axis=None averages all elements\n        3. axis=N averages along dimension\
  \ N\n        4. Return result wrapped in Tensor\n\n        EXAMPLE:\n        >>>\
  \ t = Tensor([[1, 2, 3], [4, 5, 6]])\n        >>> avg = t.mean()\n        >>> print(avg.data)\n\

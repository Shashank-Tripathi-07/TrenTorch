      print(f"After 50% pruning: {pruned_nonzero:,} non-zero weights")
      print(f"\nActual sparsity: {sparsity:.1%}")
      print(f"Half the weights are now zero!")
  
      print("\n✨ Smaller weights removed—model still works!")

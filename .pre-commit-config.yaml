# TrenTorch Pre-commit Configuration
# =============================================================================
# CLI and module validation hooks (markdown collapse, CLI docs).
#
# Install: `pre-commit install` from the repo root picks up this file
# directly (it lives at the repo root, not nested under a subdirectory).
# Run manually with: pre-commit run --all-files
# =============================================================================

repos:
  # ===========================================================================
  # MARKDOWN FORMATTING
  # ===========================================================================

  - repo: local
    hooks:
      - id: collapse-blank-lines
        name: "Collapse extra blank lines"
        description: "Replace 2+ consecutive blank lines with single blank line"
        entry: python3 platforms/dev_tools/tools/dev/collapse_blank_lines.py
        language: python
        files: \.(md|py)$
        pass_filenames: true

  # ===========================================================================
  # CLI DOCUMENTATION VALIDATORS
  # ===========================================================================

  # Disabled: platforms/dev_tools/tools/dev/validate_cli_docs.py predates the
  # data/ restructuring and the tren->platforms/cli reorg. Its DOCS_DIRS list
  # (site/modules/tests/milestones) and VALID_COMMANDS table (still lists a
  # removed `grade` command group, missing `convert`, out of date on
  # `milestone`'s real subcommands) both need updating to match the current
  # layout before this is safe to run again. See docs/cli_file_organization.md
  # for the current, accurate command/file map in the meantime.
  # - repo: local
  #   hooks:
  #     - id: validate-cli-docs
  #       name: "Validate CLI documentation"
  #       description: "Ensure tren commands in docs match actual CLI"
  #       entry: python3 platforms/dev_tools/tools/dev/validate_cli_docs.py
  #       language: python
  #       files: \.md$
  #       pass_filenames: false

  # ===========================================================================
  # PYTHON CODE QUALITY
  # ===========================================================================

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff
        name: "Lint Python code"
        args: [--fix]
      - id: ruff-format
        name: "Format Python code"

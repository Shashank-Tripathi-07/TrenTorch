name: 'Request Copilot Review'

# Requests a Copilot code review on every new pull request from a human
# author. GitHub's native "automatic Copilot review" repository ruleset has
# no per-author filter -- it fires on Dependabot and every other bot PR too,
# burning premium-request quota on reviewing a version bump nobody wrote.
# Requesting the review manually here, gated on the author not being a bot,
# gets the same effect for humans without paying for bot noise.

on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  request-review:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.type != 'Bot'
    steps:
      - name: Request Copilot review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --add-reviewer copilot-pull-request-reviewer[bot]

name: 'TrenTorch · Validate'

# =============================================================================
# TrenTorch — Comprehensive Testing Workflow
# =============================================================================
#
# Runs the same 7-stage progressive test suite TinyTorch runs against its own
# dev branch, adapted for this repo: content lives at the repo root here
# (no trentorch/ subdirectory), and main is the only long-lived branch.
#
# Flow:
#   1. INLINE_BUILD     — Build package from src/ modules
#   2. UNIT_TESTS       — Test individual module functions (parallel with 3-4)
#   3. INTEGRATION      — Cross-module validation (parallel with 2, 4)
#   4. CLI_TESTS        — Verify CLI commands work (parallel with 2-3)
#   5. E2E_TESTS        — Full end-to-end validation (gates on 2-4)
#   6. FRESH_INSTALL    — Docker-based fresh-install simulation
#   7. USER_JOURNEY     — Destructive full journey (resets + rebuilds)
#
# Triggers:
#   - push: main
#   - pull_request: every PR, any target branch
#   - workflow_dispatch: manual with test type + OS selection
#
# OS Support:
#   - Default: Both Linux and Windows (ubuntu-latest, windows-2022)
#   - Manual trigger can select: linux, windows, or all
#   - Windows uses Git Bash (shell: bash) for cross-platform compatibility
#
# Adapted from harvard-edge/cs249r_book's trentorch-validate-dev.yml. Not
# included here: the upstream link-check stage (depended on a reusable
# workflow and shared config from that monorepo that don't exist in this
# repo) and the publish/preview/PDF workflows (deploy to infrastructure —
# mlsysbook.ai, gh-pages, PyPI — that this fork doesn't have).
#
# =============================================================================

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - 'docs/**'
      - 'platforms/dev_tools/etc/**'
      - '.github/assets/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'platforms/dev_tools/etc/**'
      - '.github/assets/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Test type to run (matches: tren dev test --<type>)'
        required: false
        default: 'all'
        type: choice
        options:
          - all           # --all: Full validation (stages 1-7)
          - quick         # --unit --cli: Fast feedback, no inline build
          - standard      # Stages 1-5: inline + unit + integration + cli + e2e
          - user-journey  # --user-journey: Full destructive journey test
      os:
        description: 'Operating system to test'
        required: false
        default: 'all'
        type: choice
        options:
          - all         # Both Linux and Windows (default)
          - linux       # Ubuntu only
          - windows     # Windows only

permissions:
  contents: read
  actions: read
  pull-requests: read

# Concurrency: group by PR number for pull_request events, by commit SHA for
# push events. cancel-in-progress only applies to pull_request runs (a new
# push to the same PR branch should cancel the stale run). Push-to-main runs
# each get their own SHA-scoped group and are NEVER cancelled by a later
# push. Upstream (cs249r_book) grouped push runs by branch name alone, so
# merging two PRs back to back within a run's lifetime cancelled the first
# run outright, its conclusion came back "cancelled," and the README badge
# read as failing for a merge that was never actually broken.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('push-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TREN_ALLOW_SYSTEM: "1"
  TRENTORCH_QUIET: "1"
  PYTHONIOENCODING: "utf-8"  # Required for Windows emoji support in Rich
  PYTHONUTF8: "1"            # Force UTF-8 for all Python I/O (subprocess pipes)

jobs:
  # ===========================================================================
  # Configuration: Determine what tests to run
  # ===========================================================================
  configure:
    name: Configure
    runs-on: ubuntu-latest
    outputs:
      test_type: ${{ steps.config.outputs.test_type }}
      os_matrix: ${{ steps.config.outputs.os_matrix }}
      run_inline: ${{ steps.config.outputs.run_inline }}
      run_unit: ${{ steps.config.outputs.run_unit }}
      run_integration: ${{ steps.config.outputs.run_integration }}
      run_cli: ${{ steps.config.outputs.run_cli }}
      run_e2e: ${{ steps.config.outputs.run_e2e }}
      run_release: ${{ steps.config.outputs.run_release }}
      run_fresh_install: ${{ steps.config.outputs.run_fresh_install }}

    steps:
      - name: Check whether this push is a PR merge already validated by CI
        id: merge_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IS_PR_MERGE="false"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            # A push to main whose commit is associated with a PR that was
            # merged into main is a merge commit produced by the merge
            # button, not a direct commit: pull_request-triggered CI already
            # ran the full "standard" suite against this exact code, so
            # stages 1-6 would just be repeating work that already passed.
            # A direct push (no associated merged PR) skipped that PR CI
            # entirely, so it still gets the full "all" suite below.
            MERGED_PR=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
              --jq '[.[] | select(.merged_at != null and .base.ref == "main")] | length' 2>/dev/null || echo "0")
            if [ "$MERGED_PR" -gt 0 ]; then
              IS_PR_MERGE="true"
            fi
          fi
          echo "is_pr_merge=$IS_PR_MERGE" >> $GITHUB_OUTPUT

      - name: Determine test configuration
        id: config
        env:
          IS_PR_MERGE: ${{ steps.merge_check.outputs.is_pr_merge }}
        run: |
          # Determine test type based on trigger
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TEST_TYPE="${{ github.event.inputs.test_type }}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            TEST_TYPE="standard"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            if [ "$IS_PR_MERGE" = "true" ]; then
              # Already validated by this exact commit's PR run -- only run
              # what never ran on the PR (Stage 7's destructive journey),
              # rebuilding the package once since Stage 7 needs a fresh
              # artifact rather than reusing the PR run's.
              TEST_TYPE="release"
            else
              # Direct push to main, bypassing PR review and its CI - main
              # must be rock solid, so run everything.
              TEST_TYPE="all"
            fi
          else
            # anything else gets quick feedback
            TEST_TYPE="quick"
          fi

          echo "test_type=$TEST_TYPE" >> $GITHUB_OUTPUT

          # Determine OS matrix based on input (default: both Linux and Windows)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            OS_INPUT="${{ github.event.inputs.os }}"
          elif [ "$TEST_TYPE" = "release" ]; then
            # Only Stage 1 (rebuild the artifact) and Stage 7 (ubuntu-only)
            # run for this type, so a Windows Stage 1 build would produce an
            # artifact nothing ever downloads.
            OS_INPUT="linux"
          else
            # Automatic triggers run both Linux and Windows
            OS_INPUT="all"
          fi

          case "$OS_INPUT" in
            windows)
              # Use windows-2022: windows-latest (2025) has D: drive removed but runner still expects D:\a
              echo 'os_matrix=["windows-2022"]' >> $GITHUB_OUTPUT
              ;;
            all)
              echo 'os_matrix=["ubuntu-latest","windows-2022"]' >> $GITHUB_OUTPUT
              ;;
            *)
              echo 'os_matrix=["ubuntu-latest"]' >> $GITHUB_OUTPUT
              ;;
          esac

          # Set flags based on test type
          # Stages: inline → unit → integration → cli → e2e → fresh-install → user-journey
          case "$TEST_TYPE" in
            quick)
              echo "run_inline=false" >> $GITHUB_OUTPUT
              echo "run_unit=true" >> $GITHUB_OUTPUT
              echo "run_integration=false" >> $GITHUB_OUTPUT
              echo "run_cli=true" >> $GITHUB_OUTPUT
              echo "run_e2e=false" >> $GITHUB_OUTPUT
              echo "run_release=false" >> $GITHUB_OUTPUT
              echo "run_fresh_install=false" >> $GITHUB_OUTPUT
              ;;
            standard)
              echo "run_inline=true" >> $GITHUB_OUTPUT
              echo "run_unit=true" >> $GITHUB_OUTPUT
              echo "run_integration=true" >> $GITHUB_OUTPUT
              echo "run_cli=true" >> $GITHUB_OUTPUT
              echo "run_e2e=true" >> $GITHUB_OUTPUT
              echo "run_release=false" >> $GITHUB_OUTPUT
              echo "run_fresh_install=true" >> $GITHUB_OUTPUT
              ;;
            all|user-journey)
              echo "run_inline=true" >> $GITHUB_OUTPUT
              echo "run_unit=true" >> $GITHUB_OUTPUT
              echo "run_integration=true" >> $GITHUB_OUTPUT
              echo "run_cli=true" >> $GITHUB_OUTPUT
              echo "run_e2e=true" >> $GITHUB_OUTPUT
              echo "run_release=true" >> $GITHUB_OUTPUT
              echo "run_fresh_install=true" >> $GITHUB_OUTPUT
              ;;
            release)
              # Push to main from an already-merged, already-green PR:
              # stages 1-6 duplicate exactly what pull_request CI just ran
              # against this code. Only Stage 7 (destructive user journey)
              # never runs on a PR, so that's the only new validation this
              # push needs; Stage 1 still rebuilds since Stage 7 needs a
              # fresh package artifact of its own.
              echo "run_inline=true" >> $GITHUB_OUTPUT
              echo "run_unit=false" >> $GITHUB_OUTPUT
              echo "run_integration=false" >> $GITHUB_OUTPUT
              echo "run_cli=false" >> $GITHUB_OUTPUT
              echo "run_e2e=false" >> $GITHUB_OUTPUT
              echo "run_release=true" >> $GITHUB_OUTPUT
              echo "run_fresh_install=false" >> $GITHUB_OUTPUT
              ;;
          esac

          echo "📋 Test configuration: $TEST_TYPE"

  # ===========================================================================
  # STAGE 1: INLINE BUILD - Build package from src/
  # ===========================================================================
  # Split into two independent jobs (Ubuntu, Windows) instead of one job
  # with a {ubuntu, windows} matrix. The built package (data/trentorch/,
  # data/modules/) is pure Python with nothing OS-specific in it, and the
  # Windows leg was already advisory (continue-on-error) -- nothing
  # downstream actually depends on its outcome. Splitting means Stages 2-5
  # only wait on the Ubuntu leg (consistently the faster of the two: same
  # work, Windows' filesystem/IO overhead makes it run ~50% slower) instead
  # of waiting on whichever leg finishes last for no benefit. The Windows
  # leg still runs the full build-and-test-while-building pass end to end,
  # same coverage as before -- it's just no longer on the critical path.
  stage-1-inline-ubuntu:
    name: Stage 1 · Inline Build (ubuntu-latest)
    needs: configure
    # Runs whenever Stage 1 runs at all, regardless of the requested OS
    # matrix: even an explicit Windows-only dispatch still needs one
    # canonical build to hand to its Windows Stages 2-5 legs (see
    # download_package's unsuffixed artifact name in run-test-stage.yml).
    if: needs.configure.outputs.run_inline == 'true'
    uses: ./.github/workflows/run-test-stage.yml
    with:
      os_matrix: '["ubuntu-latest"]'
      test_flag: '--inline'
      step_label: 'Stage 1 · Inline Build'
      download_package: 'false'
      upload_package: 'true'
      timeout_minutes: 30

  stage-1-inline-windows:
    name: Stage 1 · Inline Build (windows-2022)
    needs: configure
    # Coverage-only: runs the same build-and-test pass on Windows whenever
    # Windows is in scope, but nothing downstream needs it to finish (or
    # even succeed -- advisory_windows defaults to 'true') since Stages 2-5
    # get their package from the Ubuntu leg above.
    if: |
      needs.configure.outputs.run_inline == 'true' &&
      contains(needs.configure.outputs.os_matrix, 'windows-2022')
    uses: ./.github/workflows/run-test-stage.yml
    with:
      os_matrix: '["windows-2022"]'
      test_flag: '--inline'
      step_label: 'Stage 1 · Inline Build'
      download_package: 'false'
      upload_package: 'false'
      timeout_minutes: 30

  # ===========================================================================
  # STAGE 2: UNIT TESTS - Test individual module functions
  # Runs in PARALLEL with Stages 3 and 4 (all depend only on Stage 1)
  # ===========================================================================
  stage-2-unit:
    name: Stage 2 · Unit Tests
    needs: [configure, stage-1-inline-ubuntu]
    if: |
      always() &&
      needs.configure.outputs.run_unit == 'true' &&
      (needs.stage-1-inline-ubuntu.result == 'success' || needs.stage-1-inline-ubuntu.result == 'skipped')
    uses: ./.github/workflows/run-test-stage.yml
    with:
      os_matrix: ${{ needs.configure.outputs.os_matrix }}
      test_flag: '--unit'
      step_label: 'Stage 2 · Unit Tests'
      download_package: ${{ needs.configure.outputs.run_inline }}
      timeout_minutes: 30

  # ===========================================================================
  # STAGE 3: INTEGRATION TESTS - Cross-module validation
  # Runs in PARALLEL with Stages 2 and 4 (all depend only on Stage 1)
  # ===========================================================================
  stage-3-integration:
    name: Stage 3 · Integration
    needs: [configure, stage-1-inline-ubuntu]
    if: |
      always() &&
      needs.configure.outputs.run_integration == 'true' &&
      (needs.stage-1-inline-ubuntu.result == 'success' || needs.stage-1-inline-ubuntu.result == 'skipped')
    uses: ./.github/workflows/run-test-stage.yml
    with:
      os_matrix: ${{ needs.configure.outputs.os_matrix }}
      test_flag: '--integration'
      step_label: 'Stage 3 · Integration'
      download_package: ${{ needs.configure.outputs.run_inline }}
      timeout_minutes: 15

  # ===========================================================================
  # STAGE 4: CLI TESTS - Verify CLI commands work
  # Runs in PARALLEL with Stages 2 and 3 (all depend only on Stage 1)
  # ===========================================================================
  stage-4-cli:
    name: Stage 4 · CLI Tests
    needs: [configure, stage-1-inline-ubuntu]
    if: |
      always() &&
      needs.configure.outputs.run_cli == 'true' &&
      (needs.stage-1-inline-ubuntu.result == 'success' || needs.stage-1-inline-ubuntu.result == 'skipped')
    uses: ./.github/workflows/run-test-stage.yml
    with:
      os_matrix: ${{ needs.configure.outputs.os_matrix }}
      test_flag: '--cli --parallel'
      step_label: 'Stage 4 · CLI Tests'
      download_package: ${{ needs.configure.outputs.run_inline }}
      timeout_minutes: 15

  # ===========================================================================
  # STAGE 5: E2E TESTS - Full user journey validation
  # Depends on Stages 2, 3, and 4 ALL passing (the integration gate)
  # ===========================================================================
  stage-5-e2e:
    name: Stage 5 · E2E Tests
    # Only depends on Stage 1 (needs the built-package artifact), not on
    # Stages 2-4 passing first. E2E exercises the same already-built
    # package Stages 2-4 test, it has no technical dependency on their
    # results, the old gating just made it wait for whichever of the three
    # was slowest (Stage 3's Windows leg, most often) before it could even
    # start, for no reason beyond "fail fast." E2E is cheap (well under a
    # minute per OS), so the odds of wasting that on a run 2-4 would have
    # failed anyway are low, and outweighed by not blocking on a straggler.
    needs: [configure, stage-1-inline-ubuntu]
    if: |
      always() &&
      needs.configure.outputs.run_e2e == 'true' &&
      (needs.stage-1-inline-ubuntu.result == 'success' || needs.stage-1-inline-ubuntu.result == 'skipped')
    uses: ./.github/workflows/run-test-stage.yml
    with:
      os_matrix: ${{ needs.configure.outputs.os_matrix }}
      test_flag: '--e2e --parallel'
      step_label: 'Stage 5 · E2E Tests'
      download_package: ${{ needs.configure.outputs.run_inline }}
      timeout_minutes: 15

  # ===========================================================================
  # STAGE 6: FRESH INSTALL - Simulates a real fresh-install experience
  # ===========================================================================
  # Note: Skipped for fork PRs because the branch doesn't exist in this repo
  stage-6-fresh-install:
    name: Stage 6 · Fresh Install
    runs-on: ubuntu-latest
    # Docker-based install from a fresh clone of the pushed commit, it
    # doesn't touch Stage 1's build artifact or any other stage's output,
    # so it has no real dependency on any of them. Only needs `configure`
    # for its run_fresh_install flag; runs fully in parallel with
    # everything else instead of waiting behind Stage 5.
    needs: [configure]
    if: |
      always() &&
      needs.configure.outputs.run_fresh_install == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 30

    steps:
      - name: Checkout (for test script only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            platforms/dev_tools/scripts/test-fresh-install.sh

      - name: Run Fresh Install Test (Docker)
        env:
          # TrenTorch is currently a private repo: install.sh downloads
          # itself from raw.githubusercontent.com and then clones the repo,
          # both of which 404/fail anonymously against a private repo.
          # GITHUB_TOKEN is scoped to this repo only and expires with the
          # job; both the script and install.sh already know to use it
          # when set.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # For PRs, github.ref_name is the merge ref (e.g. "12/merge") which doesn't
          # exist as a real branch on raw.githubusercontent.com. Use head_ref (the actual
          # source branch) for PRs, falling back to ref_name for push events. Passed as
          # an env var rather than interpolated into the script below: a branch name is
          # attacker-influenced input, and substituting a GitHub expression directly into
          # a shell string is exactly the injection pattern env vars exist to avoid.
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          chmod +x platforms/dev_tools/scripts/test-fresh-install.sh
          ./platforms/dev_tools/scripts/test-fresh-install.sh --branch "$BRANCH"

  # ===========================================================================
  # STAGE 7: USER JOURNEY - Destructive full journey (after all stages)
  # ===========================================================================
  stage-7-user-journey:
    name: Stage 7 · User Journey
    # Since the Stage 7 restructure, this downloads Stage 1's built-package
    # artifact directly and doesn't touch Stages 2-5's output at all, so it
    # only needs Stage 1, same reasoning as Stage 5 above.
    needs: [configure, stage-1-inline-ubuntu]
    if: |
      always() &&
      needs.configure.outputs.run_release == 'true' &&
      (needs.stage-1-inline-ubuntu.result == 'success' || needs.stage-1-inline-ubuntu.result == 'skipped')
    uses: ./.github/workflows/run-test-stage.yml
    with:
      os_matrix: '["ubuntu-latest"]'
      test_flag: '--user-journey'
      step_label: 'Stage 7 · User Journey'
      # Restructured to run milestones against Stage 1's already-built
      # package instead of rebuilding all 20 modules from scratch a second
      # time, so it now needs that artifact downloaded, same as Stages 2-5.
      download_package: ${{ needs.configure.outputs.run_inline }}
      timeout_minutes: 45

  # ===========================================================================
  # Summary: Collect and report all results
  # ===========================================================================
  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [configure, stage-1-inline-ubuntu, stage-1-inline-windows, stage-2-unit, stage-3-integration, stage-4-cli, stage-5-e2e, stage-6-fresh-install, stage-7-user-journey]
    if: always()

    steps:
      # Builds the results table and the pass/fail gate from one stage list
      # instead of two separate hand-maintained bash blocks (one per stage,
      # times two). Adding a stage now means adding one entry to STAGES
      # below, not hand-editing a table row here and a separate if-check
      # there and hoping the two stay in sync. needs.*.result is passed in
      # as JSON via an env var rather than interpolated per-field into the
      # script, matching the same untrusted-expression-into-env-var pattern
      # used for Stage 6's BRANCH value.
      - name: Generate summary and check for failures
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          cfg = needs.get("configure", {}).get("outputs", {})

          # (job id, display number, label, configure-output flag that gates it)
          STAGES = [
              ("stage-1-inline-ubuntu", 1, "📝 Inline Build",  "run_inline"),
              ("stage-2-unit",          2, "🧪 Unit Tests",    "run_unit"),
              ("stage-3-integration",   3, "🔗 Integration",   "run_integration"),
              ("stage-4-cli",           4, "💻 CLI Tests",     "run_cli"),
              ("stage-5-e2e",           5, "🌐 E2E Tests",     "run_e2e"),
              ("stage-6-fresh-install", 6, "📦 Fresh Install", "run_fresh_install"),
              ("stage-7-user-journey",  7, "🎓 User Journey",  "run_release"),
          ]

          # Windows' Stage 1 leg runs in parallel with everything else,
          # advisory only (see validate.yml's stage-1-inline-windows job
          # comment) -- shown for visibility, never added to failed_stages
          # since it was already advisory-only before the Stage 1 split too.

          def is_enabled(flag):
              return cfg.get(flag) == "true"

          lines = [
              "## ⚡ TrenTorch CI Results",
              "",
              "| Property | Value |",
              "|----------|-------|",
              f"| **Test Type** | `{cfg.get('test_type', '')}` |",
              f"| **Trigger** | {os.environ.get('GITHUB_EVENT_NAME', '')} |",
              f"| **Branch** | `{os.environ.get('GITHUB_REF_NAME', '')}` |",
              "",
              "### Test Progression (Sequential)",
              "",
              "| Stage | Test | Status |",
              "|-------|------|--------|",
          ]

          failed_stages = []
          for job_id, num, label, flag in STAGES:
              result = needs.get(job_id, {}).get("result", "skipped")
              if not is_enabled(flag):
                  status = "⏭️ Skipped"
              elif result == "success":
                  status = "✅ Passed"
              elif result == "failure":
                  status = "❌ Failed"
                  failed_stages.append((num, label))
              else:
                  status = f"⏭️ {result.capitalize()}"
              lines.append(f"| {num} | {label} | {status} |")

          if is_enabled("run_inline"):
              win_result = needs.get("stage-1-inline-windows", {}).get("result", "skipped")
              win_status = {
                  "success": "✅ Passed",
                  "skipped": "⏭️ Skipped",
              }.get(win_result, f"⚠️ {win_result.capitalize()}")
              lines.append(f"| 1w | 🪟 Inline Build (Windows, advisory) | {win_status} |")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")

          if failed_stages:
              print()
              for num, label in failed_stages:
                  print(f"❌ Stage {num} ({label}) failed")
              print()
              print("❌ CI FAILED - See above for details")
              sys.exit(1)

          print("✅ All enabled tests passed")
          PYEOF

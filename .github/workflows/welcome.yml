name: 'Welcome First-Time Contributors'

# Posts a one-time "thanks for contributing" comment the first time someone
# opens an issue or a PR against this repo. Uses GitHub's own first-interaction
# action rather than a custom script, so it only fires once per person (it
# checks the user's past issue/PR history itself) instead of commenting on
# every single contribution.

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    # Skip bot-authored issues/PRs (Dependabot, this repo's own
    # update-contributors bot, etc.): a "thanks for contributing" message
    # doesn't mean anything for an automated dependency bump.
    if: github.event.sender.type != 'Bot'
    steps:
      - uses: actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d # v3.1.0
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          issue_message: >
            Thanks for opening your first issue on TrenTorch! 🎉
            Someone will take a look soon. In the meantime, check
            the [Team Engineers](../blob/main/README.md#team-engineers) table — once this gets
            some activity, you'll show up there automatically.
          pr_message: >
            Thanks for contributing to TrenTorch! 🎉 A maintainer will review
            this shortly. Once it merges, you'll be added to the
            [Team Engineers](../blob/main/README.md#team-engineers) table automatically.

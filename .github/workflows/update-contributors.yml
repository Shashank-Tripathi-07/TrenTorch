name: 'Update Contributors Table'

# Recomputes CONTRIBUTORS.md (issues raised, PRs raised per person) from the
# real GitHub API once a night, and commits the result straight to main if
# anything changed. Used to fire on every issue/PR open/close event and go
# through a full open-a-PR-and-auto-merge cycle -- correct, but noisy: a
# short burst of PR activity (several merges/closes within seconds) could
# spawn several of these PRs at once needing manual cleanup. Nightly + a
# direct push removes both problems: nobody needs to look at this more than
# once, and there's nothing to review since this is pure, deterministic data
# computed straight from the GitHub API, not a human judgment call.

on:
  schedule:
    - cron: '11 20 * * *'  # ~1:41am IST, off-peak, minute offset from :00
  workflow_dispatch: {}

permissions:
  contents: write
  issues: read

# Guards against two runs landing at once (a scheduled run overlapping a
# manual workflow_dispatch), not against per-event races -- there's only one
# trigger a day now, so the race this used to guard against can't happen.
concurrency:
  group: update-contributors
  cancel-in-progress: false

jobs:
  update-contributors:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Run update script
        id: update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/update_contributors.py

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- docs/CONTRIBUTORS.md README.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push directly to main
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/CONTRIBUTORS.md README.md
          git commit -m "Update CONTRIBUTORS.md"
          git push origin main

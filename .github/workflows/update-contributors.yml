name: 'Update Contributors Table'

# Recomputes CONTRIBUTORS.md (issues raised, PRs raised, PRs merged per
# person) from the real GitHub API whenever an issue or PR is opened, or a
# PR closes. Opens a PR with the change and merges it immediately: this is
# pure, deterministic data (counts computed straight from the GitHub API,
# nothing subjective), so it still goes through a real PR rather than a
# direct push to main, but doesn't need a human to sit in front of it.

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened, closed]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  update-contributors:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This workflow only ever reads/writes docs/CONTRIBUTORS.md and
          # README.md based on live API stats, never a PR's own file
          # changes. Explicitly pinning main matters because the default
          # ref for a pull_request event (including Dependabot's own PRs)
          # is refs/pull/N/merge, that PR's content merged into main, not
          # main itself -- without this, the branch this job creates
          # silently bundled whatever the triggering PR changed alongside
          # the contributors update.
          ref: main

      - name: Run update script
        id: update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/update_contributors.py

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- docs/CONTRIBUTORS.md README.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open and merge update PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="update-contributors-$(date +%s)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add docs/CONTRIBUTORS.md README.md
          git commit -m "Update CONTRIBUTORS.md"
          git push origin "$BRANCH"
          gh pr create --title "Update CONTRIBUTORS.md" \
            --body "Automated update from real issue/PR activity. See .github/workflows/update-contributors.yml." \
            --base main --head "$BRANCH"
          gh pr merge "$BRANCH" --squash --delete-branch || \
            echo "::warning::Could not auto-merge, left open for manual merge."

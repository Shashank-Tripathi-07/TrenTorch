name: '🔧 Reusable · Run Test Stage'

# Backs Stages 1-5 and 7 of validate.yml. A reusable workflow (job-level
# reuse via workflow_call) rather than a composite action (step-level
# reuse): a composite action still needs the calling job to check out the
# repo itself before `uses: ./local-path` can even be resolved, which
# leaves one checkout step duplicated in every caller. A reusable workflow
# owns the whole job, checkout included, so the caller in validate.yml is
# reduced to a single `uses:` + `with:` block per stage.
#
# Called workflows don't inherit the caller's top-level `env:` context, so
# the shared env vars are redeclared here rather than in validate.yml.

on:
  workflow_call:
    inputs:
      os_matrix:
        description: 'JSON array of runner OS values, e.g. ["ubuntu-latest","windows-2022"]'
        required: true
        type: string
      test_flag:
        description: 'Flag passed to `tren dev test`, e.g. --unit, --integration'
        required: true
        type: string
      step_label:
        description: 'Human-readable label for the job name, e.g. "Stage 2 · Unit Tests"'
        required: true
        type: string
      download_package:
        description: 'Whether to download the Stage 1 built-package artifact first'
        required: false
        type: string
        default: 'true'
      upload_package:
        description: 'Whether to upload trentorch/ and modules/ as the built-package artifact after'
        required: false
        type: string
        default: 'false'
      timeout_minutes:
        description: 'Per-job timeout'
        required: false
        type: number
        default: 30
      advisory_windows:
        description: 'Whether a Windows-leg failure is advisory (continue-on-error) rather than blocking'
        required: false
        type: string
        default: 'true'

env:
  TITO_ALLOW_SYSTEM: "1"
  TRENTORCH_QUIET: "1"
  PYTHONIOENCODING: "utf-8"  # Required for Windows emoji support in Rich
  PYTHONUTF8: "1"            # Force UTF-8 for all Python I/O (subprocess pipes)
  # Temporary diagnostic: prints per-module, per-step wall-clock timing for
  # `tren dev test --inline`, to find out why Modules 02/08/09 are
  # consistently 5-8x slower than every other module in Stage 1/Stage 7.
  # Remove once that's root-caused.
  TREN_PROFILE: "1"

jobs:
  run:
    name: ${{ inputs.step_label }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    continue-on-error: ${{ inputs.advisory_windows == 'true' && contains(matrix.os, 'windows') }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.os_matrix) }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      # setup-python's cache: 'pip' input only caches pip's download cache
      # (compressed wheels), not the installed packages themselves, so
      # every job still pays the extract-and-install cost from scratch.
      # This caches both directories pip actually writes to: site-packages
      # (the importable package code) AND the scripts directory (the
      # console-script executables pip generates, e.g. jupyter, jupyter-lab).
      # A prior version of this cached only site-packages: pip saw the
      # packages already present on a cache hit and skipped regenerating
      # the console scripts, so `jupyter` ended up completely missing even
      # though `import jupyter` worked fine. Caching both together, as one
      # cache entry, keeps them consistent with each other.
      - name: Resolve site-packages and scripts paths
        id: python-paths
        run: |
          python -c "import sysconfig; print('purelib=' + sysconfig.get_paths()['purelib'])" >> "$GITHUB_OUTPUT"
          python -c "import sysconfig; print('scripts=' + sysconfig.get_paths()['scripts'])" >> "$GITHUB_OUTPUT"

      - name: Cache installed dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ steps.python-paths.outputs.purelib }}
            ${{ steps.python-paths.outputs.scripts }}
          key: py-deps-${{ runner.os }}-py3.11-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download built package from Stage 1
        if: inputs.download_package == 'true'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: built-package-${{ matrix.os }}

      - name: Run tests
        run: ./bin/tren dev test ${{ inputs.test_flag }} --ci

      # Only Stage 1 sets this: Stages 2-5 each need the exported package
      # present to skip their own redundant `tren dev export --all` (see
      # tren/commands/dev/test.py's _check_imports/_build_package). Sharing
      # Stage 1's already-built output cuts that duplicated work to zero
      # without skipping or altering any test.
      - name: Upload built package
        if: inputs.upload_package == 'true' && success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: built-package-${{ matrix.os }}
          path: |
            trentorch/
            modules/
          retention-days: 1

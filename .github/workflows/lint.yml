name: Lint

# Ruff check (style/correctness) + format check, on every push/PR to main or dev.
# Deliberately no paths-ignore: unlike validate.yml's test suite, this is
# fast enough (sub-second) that skipping it for "only touches one file"
# pushes isn't worth the required-check path-filter footgun (see
# codeql.yml's comment on the same issue).

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: lint-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('push-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install ruff
        # Exact version, matching .pre-commit-config.yaml's own ruff-pre-commit
        # `rev: v0.16.4` -- was a floor (>=0.6.0) before, which OpenSSF
        # Scorecard's Pinned-Dependencies check flags (an unbounded floor
        # installs whatever's newest on the day CI runs, no one notices a
        # version change happened). Exact match here also means CI and a
        # contributor's local pre-commit hook lint identically.
        run: pip install "ruff==0.16.4"

      - name: Ruff check (lint)
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

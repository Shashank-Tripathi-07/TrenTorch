name: 'Auto-label PRs by Changed Files'

# Applies labels from .github/labeler.yml based on which paths a PR
# touches (docs, cli, curriculum, tests, dependencies, security, etc.).
# pull_request_target since labeling needs a write-scoped token even for
# fork PRs; actions/labeler reads changed files via the API, it never
# checks out or runs any code from the PR branch itself.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          sync-labels: true

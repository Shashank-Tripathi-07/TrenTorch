name: 'Check settings.ini / pyproject.toml Version Consistency'

# settings.ini and pyproject.toml both declare the package version
# independently -- a known, documented drift risk (see
# docs/implementation.md section 9). Nothing enforced they stay in sync
# before; this comments loudly on any PR that touches either file if
# they've drifted apart, instead of letting it rot silently again.
#
# pull_request_target so the comment works on fork PRs too. Originally did
# this via `actions/checkout` at the PR's head SHA, but that's exactly the
# "untrusted code checkout in a privileged pull_request_target context"
# pattern OpenSSF Scorecard's Dangerous-Workflow check (rightly) flags,
# regardless of the fact that nothing in this workflow executes anything
# from the checkout -- the checked-out files sitting on disk in a
# privileged job is the risk, not just what this workflow does with them
# today. Fetches just the two files' text content via the REST API
# instead: no checkout, no code from the PR ever touches the runner's
# filesystem, only two small strings returned from GitHub's own API.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - 'settings.ini'
      - 'pyproject.toml'

permissions:
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fetch and compare versions
        id: compare
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            async function getFileText(path) {
              const { data } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: context.payload.pull_request.head.sha,
              });
              return Buffer.from(data.content, data.encoding).toString("utf-8");
            }

            const settingsText = await getFileText("settings.ini");
            const pyprojectText = await getFileText("pyproject.toml");

            const settingsMatch = settingsText.match(/^version\s*=\s*(\S+)/m);
            const pyprojectMatch = pyprojectText.match(/^version\s*=\s*"([^"]+)"/m);
            const settingsVersion = settingsMatch ? settingsMatch[1] : "unparseable";
            const pyprojectVersion = pyprojectMatch ? pyprojectMatch[1] : "unparseable";

            core.setOutput("settings_version", settingsVersion);
            core.setOutput("pyproject_version", pyprojectVersion);
            core.setOutput("mismatch", settingsVersion !== pyprojectVersion ? "true" : "false");

      - name: Comment if mismatched
        if: steps.compare.outputs.mismatch == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SETTINGS_VERSION: ${{ steps.compare.outputs.settings_version }}
          PYPROJECT_VERSION: ${{ steps.compare.outputs.pyproject_version }}
        with:
          script: |
            const settingsVersion = process.env.SETTINGS_VERSION;
            const pyprojectVersion = process.env.PYPROJECT_VERSION;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body:
                `⚠️ \`settings.ini\` (version \`${settingsVersion}\`) and \`pyproject.toml\` ` +
                `(version \`${pyprojectVersion}\`) disagree on the package version. These need to ` +
                `stay in sync -- see docs/implementation.md's "Known-broken or inaccurate" section ` +
                `for why this is a known drift risk, not a new problem.`,
            });

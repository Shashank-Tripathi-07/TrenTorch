version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Actions are pinned to commit SHAs (see .github/workflows/ and
    # .github/actions/setup-trentorch/) rather than mutable tags, so this
    # is what keeps those pins current without hand-resolving new SHAs
    # every time an action ships a security fix.
    commit-message:
      prefix: "ci"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    # requirements.txt is a pip-compile --generate-hashes lockfile compiled
    # from requirements.in (the human-edited source of version floors:
    # NumPy, Jupyter, Jupytext, nbdev, Rich, PyYAML, pytest, etc.);
    # pyproject.toml's own dependency list mirrors requirements.in.
    # Dependabot's pip support understands hash-pinned requirements files
    # directly -- it rewrites both the version and the hash in the same PR
    # when it bumps a dependency, so this is what keeps requirements.txt's
    # hashes current without anyone hand-running pip-compile for routine
    # bumps (only adding/removing a dependency in requirements.in needs
    # that by hand). Also what catches a CVE in either file without
    # someone noticing by hand.
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Actions are pinned to commit SHAs (see .github/workflows/ and
    # .github/actions/setup-trentorch/) rather than mutable tags, so this
    # is what keeps those pins current without hand-resolving new SHAs
    # every time an action ships a security fix.
    commit-message:
      prefix: "ci"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    # requirements.txt is the single source of truth for the curriculum's
    # runtime toolchain (NumPy, Jupyter, Jupytext, nbdev, Rich, PyYAML,
    # psutil, pytest); pyproject.toml's own dependency list mirrors it.
    # This is what catches a CVE in either without someone noticing by hand.
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"

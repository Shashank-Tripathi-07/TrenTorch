name: 'Set up TrenTorch'
description: >
  Checkout, install Python + requirements.txt, and optionally download
  Stage 1's already-built package artifact. Collapses the block that was
  previously duplicated verbatim across every stage in validate.yml into
  one place, so bumping the Python version or the pinned action SHAs only
  needs to happen here.

inputs:
  os:
    description: 'matrix.os value, used to name the Stage 1 artifact to download'
    required: true
  download-package:
    description: 'Whether to download the Stage 1 built-package artifact'
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    - name: Setup Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: requirements.txt

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Download built package from Stage 1
      if: inputs.download-package == 'true'
      continue-on-error: true
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: built-package-${{ inputs.os }}

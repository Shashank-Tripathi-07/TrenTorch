<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="140" height="140">
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#ffb347" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#d4740c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#d4740c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="boltFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffcf70"/>
      <stop offset="55%" stop-color="#ff9d2e"/>
      <stop offset="100%" stop-color="#d4740c"/>
    </linearGradient>
  </defs>

  <circle cx="100" cy="96" r="88" fill="url(#glow)">
    <animate attributeName="r" values="78;92;78" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.55;0.95;0.55" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <g transform="translate(100 100)">
    <polygon
      points="14,-70 -46,10 -6,10 -14,70 46,-10 6,-10"
      fill="url(#boltFill)"
      stroke="#3a2308"
      stroke-width="2.5"
      stroke-linejoin="round">
      <animate attributeName="opacity" values="0.65;1;0.65" dur="1.6s" repeatCount="indefinite"/>
    </polygon>
    <polygon
      points="14,-70 -46,10 -6,10 -14,70 46,-10 6,-10"
      fill="none"
      stroke="#fff2d6"
      stroke-width="1"
      stroke-linejoin="round"
      opacity="0.7">
      <animate attributeName="opacity" values="0.15;0.7;0.15" dur="1.6s" repeatCount="indefinite"/>
    </polygon>
  </g>
</svg>
